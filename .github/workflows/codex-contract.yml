# Codex's shared app-server lifecycle may change. The pin lives only in the script.
# Real scratch daemon + local model stand-in; no account, tokens or simulator.
name: Codex contract

on:
  pull_request:
    paths:
      - scripts/ci/codex-contract.py
      - .github/workflows/codex-contract.yml
      - Sources/Waycar/Transport/Codex/**
      - docs/design/codex-backend.md
      - docs/research/codex/**
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codex-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned:
    name: Pinned Codex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
      - name: Check the pinned Codex
        run: python3 scripts/ci/codex-contract.py

  latest:
    name: Latest Codex (warn only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
      - name: Check latest npm release
        run: python3 scripts/ci/codex-contract.py --latest --warn
