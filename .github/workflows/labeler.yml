# Labels pull requests by the paths they touch (area/*) and by size (size/*).
# It runs on pull_request_target so it can label PRs from forks, and so it
# never checks out or runs PR code: actions/labeler reads the changed-file list
# from the API and the config from the base branch.

name: Labeler

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] labels only; no checkout, no PR code runs, config is read from the base branch
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

      - name: Size label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const changed = pr.additions + pr.deletions;
            const size =
              changed < 10 ? 'XS' :
              changed < 50 ? 'S' :
              changed < 250 ? 'M' :
              changed < 1000 ? 'L' : 'XL';
            const wanted = `size/${size}`;
            const { owner, repo } = context.repo;
            const issue_number = pr.number;
            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, { owner, repo, issue_number });
            for (const { name } of current) {
              if (name.startsWith('size/') && name !== wanted) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              }
            }
            if (!current.some((l) => l.name === wanted)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [wanted] });
            }
