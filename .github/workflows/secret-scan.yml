# Leak scan on every pull request and push to main, fork PRs included.
#
# 1. gitleaks, a pinned release whose tarball is checked against the SHA-256
#    in its release's checksums file, with .gitleaks.toml (gitleaks' default
#    rules plus commented allowlists for fixtures and public client keys).
# 2. scripts/secret-scan/scan.py with the generic rules beside it: private
#    IPv4 ranges (RFC 1918 and 100.64/10), Tailscale MagicDNS names, PEM and token
#    formats, key files. Accepted hits are in scripts/secret-scan/scan-allow.tsv,
#    each with a reason.
#
# Read-only token, no secrets, no third-party actions besides checkout.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: gitleaks
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1'

      - name: Generic leak check
        run: python3 scripts/secret-scan/scan.py --no-external .
