name: Bug report
description: Something in the app, the Host Tools or the relay does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems go through SECURITY.md, not here.
        Leave out passwords, keys, tokens, Pairing Codes and anything private from your screens or logs.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a Host over …
        2. Open an Agent …
        3. …
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Waycar version and device
      description: Settings › About shows the version and build.
      placeholder: 1.3.0 (150), iPhone 17 Pro, iOS 26.4
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Host runtime
      multiple: true
      options:
        - herdr
        - tmux
        - herdr-core
        - not sure
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host details
      description: Host OS, herdr / tmux / herdr-core version, Waycar plugin version (`waycar version`), and the agent involved.
      placeholder: Ubuntu 24.04, herdr 0.9.3, plugin 2.3.0, claude 2.1
  - type: input
    id: network
    attributes:
      label: How the phone reaches the Host
      description: Same network, VPN or tailnet, Jump Host, mosh or plain SSH.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Anything the app, the installer or `waycar status --json` printed. Redact host names and addresses if you need to.
      render: text
