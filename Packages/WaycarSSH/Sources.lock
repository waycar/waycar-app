# Reviewed Waycar patches in Patches/libssh2, applied in this order on top of
# the libssh2 snapshot: "<file> <sha256>". The build refuses a patch file that
# is missing, unlisted, or changed.
LIBSSH2_PATCHES=(
    "0001-userauth-publickey-skip-pk-ok-query.patch fe561687e186392d9b5adcacebd1cd6bcce0156cf3baae20982dab3d30bbe42d"
    "0002-channel-pty-and-process-request-back-to-back.patch 53befb159f1110a495e317d2e9e73126bbd46a7943a519bfca3f1737fa3de2ed"
    "0003-packet-requirev-skip-other-channel-replies.patch 994104e172c70c65c5a24be49697f93ad08223f80552e5f3375bcf3f86751638"
    "0004-channel-pipelined-opens.patch 5d9180c37def00d54c7e9a8d6dfacadc37292a9fec89b9f6a50e52de9ff82f8c"
)
# Functions the patches export; verify-native.sh requires each to be defined
# in every CLibSSH2 slice and, with the macros below, declared in its headers.
LIBSSH2_PATCH_SYMBOLS=(
    libssh2_channel_request_pty_process_startup
    libssh2_channel_open_start
    libssh2_channel_direct_tcpip_start
    libssh2_channel_direct_streamlocal_start
    libssh2_channel_open_finish
)
LIBSSH2_PATCH_MACROS=(
    LIBSSH2_FLAG_PUBKEY_SKIP_QUERY
    LIBSSH2_CHANNEL_DENIED_PTY
    LIBSSH2_CHANNEL_DENIED_PROCESS
)

