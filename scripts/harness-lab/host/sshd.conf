# Harness lab sshd: key-only login for `waycar`. herdr Hosts need
# direct-streamlocal onto the herdr socket, which `AllowTcpForwarding no`
# would block whatever AllowStreamLocalForwarding says (AGENTS.md).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers waycar
AllowTcpForwarding local
AllowStreamLocalForwarding local
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
