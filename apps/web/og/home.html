<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .grid { -webkit-mask-image: radial-gradient(ellipse 55% 75% at 30% 45%, #000 5%, transparent 80%); }
  .glow {
    position: absolute; left: 610px; top: 90px; width: 640px; height: 640px;
    background: radial-gradient(closest-side, rgb(139 92 246 / 0.45), rgb(34 211 238 / 0.16) 55%, transparent 82%);
    filter: blur(34px);
  }
  .copy { position: absolute; z-index: 2; left: 76px; top: 0; bottom: 0; width: 600px;
    display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; border-radius: 15px;
    box-shadow: 0 0 0 1.5px rgb(139 92 246 / 0.25), 0 14px 40px -12px rgb(139 92 246 / 0.35); }
  .brand span { font-size: 42px; font-weight: 650; letter-spacing: -0.03em; }
  h1 { margin-top: 38px; font-size: 64px; white-space: nowrap; font-weight: 650; line-height: 1.04; letter-spacing: -0.045em; }
  h1 span { display: block; padding-bottom: 3px; }
  .sub { margin-top: 30px; font-size: 27px; line-height: 1.35; color: var(--text-2); letter-spacing: -0.01em; max-width: 520px; }
  .sub b { font-weight: 500; color: var(--text); }

  .phone {
    position: absolute; z-index: 1; left: 736px; top: 64px; width: 400px; height: 900px;
    padding: 10px; border-radius: 62px; background: var(--bezel-phone);
    box-shadow: 0 0 0 1.5px rgb(255 255 255 / 0.16), 0 50px 90px -20px rgb(0 0 0 / 0.95), 0 0 90px -20px rgb(34 211 238 / 0.4);
  }
  .phone img { display: block; width: 100%; border-radius: 53px; }
  .fade { position: absolute; z-index: 1; left: 700px; right: 0; bottom: 0; height: 90px;
    background: linear-gradient(180deg, transparent, rgb(7 8 11 / 0.85)); }
  .callout {
    position: absolute; z-index: 3; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; font: 500 20px / 1 var(--font-mono); color: var(--text-2);
    background: rgb(12 13 18 / 0.92); border: 1.5px solid var(--line-2); border-radius: 14px;
    box-shadow: 0 20px 40px -12px rgb(0 0 0 / 0.8);
  }
  .c1 { left: 646px; top: 446px; }
  .callout .pill { font-size: 18px; padding: 4px 10px; }
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="phone"><img src="../src/assets/screens/iphone-console.png" alt=""></div>
  <div class="fade"></div>
  <p class="callout c1"><span class="pill pill-mosh">MOSH</span>wi-fi → cellular · still attached</p>
  <div class="copy">
    <div class="brand"><img src="../../../docs/images/waycar-icon.svg" alt=""><span>Waycar</span></div>
    <h1><span class="title-text">Every agent.</span><span class="title-text">Every machine.</span><span class="grad-text">One list.</span></h1>
    <p class="sub">Your coding agents in <b>herdr</b> and <b>tmux</b>, on iPhone and iPad. Blocked ones on top.</p>
  </div>
</body></html>
