<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<!-- Hero-style: headline centred in the 630×630 square, iPad rising from the bottom edge. -->
<style>
  .grid { -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 22%, #000 5%, transparent 78%); }
  .glow {
    position: absolute; left: 50%; top: 250px; width: 1100px; height: 600px; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgb(139 92 246 / 0.42), rgb(34 211 238 / 0.14) 55%, transparent 82%);
    filter: blur(40px);
  }
  .head { position: absolute; z-index: 2; left: 0; right: 0; top: 40px; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 14px; }
  .brand img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 0 0 1.5px rgb(139 92 246 / 0.25), 0 12px 36px -10px rgb(139 92 246 / 0.4); }
  .brand span { font-size: 34px; font-weight: 650; letter-spacing: -0.03em; }
  h1 { margin-top: 12px; font-size: 84px; white-space: nowrap; font-weight: 650; line-height: 1.02; letter-spacing: -0.045em; }
  .ipad {
    position: absolute; z-index: 1; left: 50%; top: 268px; width: 860px; transform: translateX(-50%);
    padding: 13px; border-radius: 32px; background: var(--bezel-tablet);
    box-shadow: 0 0 0 1.5px rgb(255 255 255 / 0.14), inset 0 0 0 1px rgb(255 255 255 / 0.04),
      0 60px 120px -30px rgb(0 0 0 / 0.9), 0 30px 60px -30px rgb(139 92 246 / 0.45);
  }
  .ipad img { display: block; width: 100%; border-radius: 20px; }
  .callout {
    position: absolute; z-index: 3; display: flex; align-items: center; gap: 12px;
    padding: 12px 15px; font: 500 18px / 1 var(--font-mono); color: var(--text-2); white-space: nowrap;
    background: rgb(12 13 18 / 0.92); border: 1.5px solid var(--line-2); border-radius: 14px;
    box-shadow: 0 24px 50px -16px rgb(0 0 0 / 0.9);
  }
  .callout b { font-weight: 500; color: var(--text); }
  .k { padding: 3px 8px; border: 1.5px solid var(--line-2); border-radius: 7px; color: var(--text); }
  .l1 { left: 56px; top: 420px; }
  .r1 { right: 48px; top: 318px; }
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <p class="callout l1"><span class="k">⌘N</span>new agent</p>
  <p class="callout r1"><b>drag &amp; drop</b> → Composer</p>
  <div class="head">
    <div class="brand"><img src="../../../docs/images/waycar-icon.svg" alt=""></div>
    <h1><span class="title-text">Waycar on </span><span class="grad-text">iPad.</span></h1>
  </div>
  <div class="ipad"><img src="../src/assets/screens/ipad-console.png" alt=""></div>
</body></html>
