<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<!-- /carplay: headline left, the spoken approval (the app's own lines) right. No car screen, no Apple art. -->
<style>
  .grid { -webkit-mask-image: radial-gradient(ellipse 70% 70% at 30% 30%, #000 5%, transparent 78%); }
  .glow {
    position: absolute; right: -120px; top: 60px; width: 760px; height: 560px;
    background: radial-gradient(closest-side, rgb(139 92 246 / 0.32), rgb(34 211 238 / 0.12) 55%, transparent 82%);
    filter: blur(40px);
  }
  .head { position: absolute; z-index: 2; left: 72px; top: 112px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 56px; height: 56px; border-radius: 13px; box-shadow: 0 0 0 1.5px rgb(139 92 246 / 0.25), 0 12px 36px -10px rgb(139 92 246 / 0.4); }
  .brand span { font-size: 32px; font-weight: 650; letter-spacing: -0.03em; }
  h1 { margin-top: 48px; font-size: 68px; white-space: nowrap; font-weight: 650; line-height: 1.02; letter-spacing: -0.045em; }
  .muted { color: var(--text-3); }
  .sub { margin-top: 32px; font: 500 21px / 1.4 var(--font-mono); color: var(--text-2); }
  .card {
    position: absolute; z-index: 2; right: 64px; top: 118px; width: 500px;
    padding: 36px 36px 34px; border-radius: 22px;
    background: linear-gradient(180deg, rgb(255 255 255 / 0.05), rgb(255 255 255 / 0.018)), var(--bg-2);
    border: 1.5px solid var(--line-2);
    box-shadow: 0 60px 120px -30px rgb(0 0 0 / 0.9), 0 30px 60px -30px rgb(139 92 246 / 0.4);
  }
  ol { list-style: none; position: relative; display: grid; gap: 22px; }
  ol::before { content: ''; position: absolute; top: 16px; bottom: 16px; left: 15.5px; width: 1.5px; background: var(--line-2); }
  li { position: relative; display: grid; grid-template-columns: 32px 1fr; column-gap: 18px; row-gap: 6px; align-items: center; }
  .mark { width: 32px; height: 32px; border-radius: 8px; }
  .you-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--bg-2); border: 1.5px solid rgb(167 139 250 / 0.5); }
  .you-mark::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--violet-soft); }
  .who { font: 500 17px / 1 var(--font-mono); color: var(--text-3); }
  .you .who { color: var(--violet-soft); }
  q { grid-column: 2; font-size: 26px; line-height: 1.35; letter-spacing: -0.015em; quotes: '“' '”'; }
  .you q { color: var(--violet-soft); }
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="head">
    <div class="brand"><img src="../../../docs/images/waycar-icon.svg" alt=""><span>Waycar</span></div>
    <h1><span class="title-text">Your agents,<br>out loud.</span><br><span class="muted">Nothing to read.</span></h1>
    <p class="sub">Waycar in CarPlay</p>
  </div>
  <div class="card">
    <ol>
      <li><img class="mark" src="../../../docs/images/waycar-icon.svg" alt=""><span class="who">Waycar</span>
        <q>api Claude is waiting on approval to run npm test. Allow or deny?</q></li>
      <li class="you"><span class="you-mark"></span><span class="who">You</span><q>Allow.</q></li>
      <li><img class="mark" src="../../../docs/images/waycar-icon.svg" alt=""><span class="who">Waycar</span><q>Allowed.</q></li>
    </ol>
  </div>
</body></html>
